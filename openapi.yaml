openapi: 3.1.0

info:
  title: TaskFlow API
  version: 1.0.0
  description: >
    A TaskFlow é uma API simples de gerenciamento de tarefas que permite criar projetos,
    gerenciar tarefas nesses projetos, atualizar o status das tarefas e excluí-las.

    **Importante:** a maioria das operações depende de outras. Você precisa criar um projeto
    antes de criar tarefas e criar uma tarefa antes de atualizá-la ou excluí-la.
    Siga o fluxo descrito nos guias para usar a API corretamente.

servers:
  - url: https://test-writechoice.onrender.com/
    description: Servidor de produção

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Todas as requisições devem incluir uma chave de API válida no cabeçalho Authorization.
        Exemplo: `Authorization: Bearer <sua_chave_de_api>`

  schemas:
    Project:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
          description: Identificador exclusivo do projeto, gerado automaticamente.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          description: Nome do projeto.
          example: "API Documentation Revamp"
        description:
          type: string
          nullable: true
          description: Descrição opcional do projeto.
          example: "Rewriting all public-facing API docs for v2."
        created_at:
          type: string
          format: date-time
          description: Data e hora de criação do projeto.
          example: "2025-05-12T10:30:00.000Z"

    Task:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
          description: Identificador exclusivo da tarefa, gerado automaticamente.
          example: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
        project_id:
          type: string
          format: uuid
          description: ID do projeto ao qual esta tarefa pertence.
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        title:
          type: string
          description: Título da tarefa.
          example: "Write introduction page"
        description:
          type: string
          nullable: true
          description: Descrição opcional da tarefa.
          example: "Draft the overview and getting started sections."
        status:
          type: string
          enum: [pending, in_progress, done]
          description: >
            Status atual da tarefa.
            - `pending`: a tarefa ainda não foi iniciada.
            - `in_progress`: a tarefa está em andamento.
            - `done`: a tarefa foi concluída.
          example: "pending"
        created_at:
          type: string
          format: date-time
          description: Data e hora de criação da tarefa.
          example: "2025-05-12T10:35:00.000Z"
        updated_at:
          type: string
          format: date-time
          description: Data e hora da última atualização da tarefa.
          example: "2025-05-12T11:00:00.000Z"

    TaskList:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
          description: ID do projeto consultado.
        total:
          type: integer
          description: Quantidade total de tarefas no projeto.
          example: 3
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Tipo resumido do erro.
          example: "Not Found"
        message:
          type: string
          description: Explicação do erro em linguagem legível.
          example: "No project found with project_id 'abc123'."

paths:
  /projects:
    post:
      summary: Criar um projeto
      operationId: createProject
      description: >
        Cria um projeto. O `project_id` retornado na resposta é necessário
        para criar tarefas. É preciso criar um projeto antes de criar tarefas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Nome do projeto. Obrigatório.
                  example: "API Documentation Revamp"
                description:
                  type: string
                  description: Descrição opcional do projeto.
                  example: "Rewriting all public-facing API docs for v2."
      responses:
        "201":
          description: Projeto criado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                project_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                name: "API Documentation Revamp"
                description: "Rewriting all public-facing API docs for v2."
                created_at: "2025-05-12T10:30:00.000Z"
        "400":
          description: Corpo da requisição ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Bad Request"
                message: "The 'name' field is required and must be a non-empty string."
        "401":
          description: Chave de API ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
                message: "Missing or invalid API key. Provide a valid key in the Authorization header as: Bearer <api_key>"

  /tasks:
    post:
      summary: Criar uma tarefa
      operationId: createTask
      description: >
        Cria uma tarefa em um projeto existente. Requer um `project_id` válido,
        obtido em `POST /projects`. As tarefas são criadas com o status inicial `pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - title
              properties:
                project_id:
                  type: string
                  format: uuid
                  description: ID do projeto ao qual a tarefa será adicionada. Obrigatório.
                  example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                title:
                  type: string
                  description: Título da tarefa. Obrigatório.
                  example: "Write introduction page"
                description:
                  type: string
                  description: Descrição opcional da tarefa.
                  example: "Draft the overview and getting started sections."
      responses:
        "201":
          description: Tarefa criada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                task_id: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
                project_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                title: "Write introduction page"
                description: "Draft the overview and getting started sections."
                status: "pending"
                created_at: "2025-05-12T10:35:00.000Z"
                updated_at: "2025-05-12T10:35:00.000Z"
        "400":
          description: Corpo da requisição ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Chave de API ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Projeto não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Not Found"
                message: "No project found with project_id 'abc123'. Create a project first using POST /projects."

  /projects/{project_id}/tasks:
    get:
      summary: Listar tarefas de um projeto
      operationId: listTasks
      description: >
        Retorna todas as tarefas de um projeto específico. Requer um `project_id` válido.
        Se o projeto existir, mas ainda não tiver tarefas, retorna um array `tasks` vazio.
      parameters:
        - name: project_id
          in: path
          required: true
          description: ID do projeto cujas tarefas serão consultadas.
          schema:
            type: string
            format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        "200":
          description: Tarefas consultadas com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
              example:
                project_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                total: 1
                tasks:
                  - task_id: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
                    project_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    title: "Write introduction page"
                    description: "Draft the overview and getting started sections."
                    status: "pending"
                    created_at: "2025-05-12T10:35:00.000Z"
                    updated_at: "2025-05-12T10:35:00.000Z"
        "401":
          description: Chave de API ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Projeto não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Not Found"
                message: "No project found with project_id 'abc123'."

  /tasks/{task_id}:
    patch:
      summary: Atualizar uma tarefa
      operationId: updateTask
      description: >
        Atualiza um ou mais campos de uma tarefa existente. Você pode atualizar `status`,
        `title` ou `description`. É necessário informar pelo menos um campo.
        Os valores válidos para o status são: `pending`, `in_progress` e `done`.
      parameters:
        - name: task_id
          in: path
          required: true
          description: ID da tarefa a ser atualizada.
          schema:
            type: string
            format: uuid
          example: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, in_progress, done]
                  description: Novo status da tarefa.
                  example: "in_progress"
                title:
                  type: string
                  description: Novo título da tarefa.
                  example: "Write introduction and quickstart pages"
                description:
                  type: string
                  description: Nova descrição da tarefa.
                  example: "Updated scope to include quickstart."
      responses:
        "200":
          description: Tarefa atualizada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                task_id: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
                project_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                title: "Write introduction page"
                description: "Draft the overview and getting started sections."
                status: "in_progress"
                created_at: "2025-05-12T10:35:00.000Z"
                updated_at: "2025-05-12T11:00:00.000Z"
        "400":
          description: Valor de status inválido ou campos ausentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Bad Request"
                message: "Invalid status 'completed'. Allowed values are: pending, in_progress, done."
        "401":
          description: Chave de API ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Tarefa não encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Not Found"
                message: "No task found with task_id 'abc123'."

    delete:
      summary: Excluir uma tarefa
      operationId: deleteTask
      description: >
        Exclui uma tarefa permanentemente. Esta ação não pode ser desfeita.
        Requer um `task_id` válido, obtido em `POST /tasks`.
      parameters:
        - name: task_id
          in: path
          required: true
          description: ID da tarefa a ser excluída.
          schema:
            type: string
            format: uuid
          example: "f9e8d7c6-b5a4-3210-fedc-ba9876543210"
      responses:
        "200":
          description: Tarefa excluída com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Task 'f9e8d7c6-b5a4-3210-fedc-ba9876543210' was successfully deleted."
        "401":
          description: Chave de API ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Tarefa não encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Not Found"
                message: "No task found with task_id 'abc123'."
